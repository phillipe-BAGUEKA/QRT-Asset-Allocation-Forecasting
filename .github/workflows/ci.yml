name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e '.[app,research,dev]'
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src app frontend scripts
      - name: Check dependencies
        run: python -m pip check
      - name: Smoke-test persisted model and API
        run: >-
          python -c "from fastapi.testclient import TestClient;
          from app.main import app;
          payload={f'RET_{i}':0.0 for i in range(1,21)};
          client=TestClient(app).__enter__();
          assert client.get('/health').status_code==200;
          assert client.get('/model-info').status_code==200;
          assert client.post('/predict',json=payload).status_code==200;
          client.__exit__(None,None,None)"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
